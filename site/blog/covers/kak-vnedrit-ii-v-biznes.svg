<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/><stop offset=".5" stop-color="#5ac8ff"/><stop offset="1" stop-color="#ff79c0"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".28"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3be0e0" stop-opacity=".2"/><stop offset="1" stop-color="#3be0e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="rgba(255,255,255,.07)"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".2"/><stop offset="1" stop-color="#8b7cff" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a12"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="330" cy="150" rx="420" ry="300" fill="url(#glow1)"/>
  <ellipse cx="920" cy="500" rx="420" ry="300" fill="url(#glow2)"/>

  <!-- roadmap path -->
  <path d="M120 500C300 480 320 330 470 322s180 60 330 40 180-130 260-160" stroke="rgba(255,255,255,.16)" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- step 1 -->
  <circle cx="120" cy="500" r="34" fill="rgba(139,124,255,.12)" stroke="#8b7cff" stroke-width="2"/>
  <text x="120" y="510" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#b9aefc">01</text>
  <rect x="76" y="552" width="88" height="12" rx="6" fill="rgba(255,255,255,.18)"/>
  <!-- step 2 -->
  <circle cx="470" cy="322" r="34" fill="rgba(90,200,255,.12)" stroke="#5ac8ff" stroke-width="2"/>
  <text x="470" y="332" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#9fd8ff">02</text>
  <rect x="426" y="374" width="88" height="12" rx="6" fill="rgba(255,255,255,.18)"/>
  <!-- step 3 -->
  <circle cx="1060" cy="202" r="34" fill="rgba(255,121,192,.12)" stroke="#ff79c0" stroke-width="2"/>
  <text x="1060" y="212" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#ffb3d5"/>
  <path d="M1049 202l8 8 15-16" stroke="#ff79c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- AI chip center -->
  <rect x="530" y="130" width="150" height="120" rx="20" fill="rgba(10,10,18,.85)" stroke="url(#g)" stroke-width="2.5"/>
  <text x="605" y="205" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="52" fill="url(#g)">AI</text>
  <g stroke="rgba(255,255,255,.35)" stroke-width="2.5">
    <line x1="558" y1="112" x2="558" y2="130"/><line x1="605" y1="112" x2="605" y2="130"/><line x1="652" y1="112" x2="652" y2="130"/>
    <line x1="558" y1="250" x2="558" y2="268"/><line x1="605" y1="250" x2="605" y2="268"/><line x1="652" y1="250" x2="652" y2="268"/>
    <line x1="512" y1="160" x2="530" y2="160"/><line x1="512" y1="190" x2="530" y2="190"/><line x1="512" y1="220" x2="530" y2="220"/>
    <line x1="680" y1="160" x2="698" y2="160"/><line x1="680" y1="190" x2="698" y2="190"/><line x1="680" y1="220" x2="698" y2="220"/>
  </g>
  <!-- ROI chart -->
  <rect x="790" y="330" width="300" height="210" rx="18" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
  <rect x="812" y="352" width="96" height="11" rx="5.5" fill="rgba(255,255,255,.25)"/>
  <rect x="822" y="466" width="34" height="52" rx="6" fill="url(#bar)"/>
  <rect x="870" y="438" width="34" height="80" rx="6" fill="url(#bar)"/>
  <rect x="918" y="404" width="34" height="114" rx="6" fill="url(#bar)"/>
  <rect x="966" y="382" width="34" height="136" rx="6" fill="url(#g)"/>
  <path d="M826 452c40-24 74-40 106-62s60-40 96-52" stroke="#3be0e0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M1016 330l16-2-6 16" fill="none" stroke="#3be0e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ruble coin -->
  <circle cx="220" cy="180" r="52" fill="rgba(59,224,224,.07)" stroke="#3be0e0" stroke-width="2.2"/>
  <text x="220" y="200" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="54" fill="#3be0e0">₽</text>
  <circle cx="303" cy="120" r="20" fill="rgba(59,224,224,.05)" stroke="rgba(59,224,224,.5)" stroke-width="1.6"/>
  <text x="303" y="128" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="rgba(59,224,224,.7)">₽</text>
</svg>
